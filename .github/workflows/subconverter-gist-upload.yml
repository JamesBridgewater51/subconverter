name: Subconverter Gist Upload

on:
  workflow_dispatch:
    inputs:
      gist_pool_url:
        description: 'Single subscription pool Gist URL'
        required: true
        type: string
      airport_urls:
        description: 'Airport subscription URLs (one per line)'
        required: true
        type: string
      target:
        description: 'Target format (clash, surge, etc.)'
        required: false
        default: 'clash'
        type: string
      upload_filename:
        description: 'Filename for uploaded Gist'
        required: false
        default: 'subconverter_config.yaml'
        type: string
  schedule:
    # Run daily at 00:00 UTC (08:00 Beijing time)
    - cron: '0 0 * * *'

jobs:
  convert-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure Gist token
        run: |
          cat > base/gistconf.ini << EOF
          [common]
          token = ${{ secrets.GIST_TOKEN }}
          EOF
      
      - name: Start Subconverter service
        run: |
          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            -v ${{ github.workspace }}/base:/base \
            tindy2013/subconverter:latest
      
      - name: Wait for service to be ready
        run: |
          echo "Waiting for subconverter service..."
          for i in {1..30}; do
            if curl -s http://localhost:25500/version > /dev/null 2>&1; then
              echo "Service is ready!"
              break
            fi
            echo "Attempt $i: Service not ready yet, waiting..."
            sleep 2
          done
          
          # Final check
          if ! curl -s http://localhost:25500/version > /dev/null 2>&1; then
            echo "Service failed to start"
            docker logs subconverter
            exit 1
          fi
      
      - name: Prepare subscription URLs
        id: prepare
        run: |
          # For manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            POOL_URL="${{ github.event.inputs.gist_pool_url }}"
            AIRPORT_URLS="${{ github.event.inputs.airport_urls }}"
            TARGET="${{ github.event.inputs.target }}"
            FILENAME="${{ github.event.inputs.upload_filename }}"
          else
            # For scheduled runs, use repository secrets
            POOL_URL="${{ secrets.GIST_POOL_URL }}"
            AIRPORT_URLS="${{ secrets.AIRPORT_URLS }}"
            TARGET="${{ vars.TARGET || 'clash' }}"
            FILENAME="${{ vars.UPLOAD_FILENAME || 'subconverter_config.yaml' }}"
          fi
          
          # Write URLs to a file in the base directory (mounted to container)
          URLS_FILE="${{ github.workspace }}/base/subscription_urls.txt"
          echo "$POOL_URL" > "$URLS_FILE"
          
          # Add airport URLs - handle both space-separated and newline-separated
          # First, convert any spaces to newlines, then process line by line
          NORMALIZED_URLS=$(echo "$AIRPORT_URLS" | tr ' ' '\n')
          
          while IFS= read -r url; do
            # Skip empty lines
            if [ -n "$url" ]; then
              echo "$url" >> "$URLS_FILE"
            fi
          done <<< "$NORMALIZED_URLS"
          
          # Count total URLs for logging
          URL_COUNT=$(wc -l < "$URLS_FILE")
          echo "Total URLs written to file: $URL_COUNT"
          
          # Encode filename
          ENCODED_FILENAME=$(echo -n "$FILENAME" | jq -sRr @uri)
          
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "upload_filename=$ENCODED_FILENAME" >> $GITHUB_OUTPUT
          echo "urls_file=/base/subscription_urls.txt" >> $GITHUB_OUTPUT
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT
      
      - name: Convert and upload to Gist
        run: |
          # Read URLs from file and join with pipe separator (subconverter format)
          URLS_FILE="${{ github.workspace }}/base/subscription_urls.txt"
          
          # Read all non-empty lines, URL-encode each, and join with pipe
          COMBINED_URLS=""
          while IFS= read -r url || [ -n "$url" ]; do
            # Skip empty lines
            if [ -n "$url" ]; then
              # URL-encode the subscription URL
              ENCODED_URL=$(echo -n "$url" | jq -sRr @uri)
              if [ -z "$COMBINED_URLS" ]; then
                COMBINED_URLS="$ENCODED_URL"
              else
                COMBINED_URLS="${COMBINED_URLS}|${ENCODED_URL}"
              fi
            fi
          done < "$URLS_FILE"
          
          # URL-encode the entire combined string (to escape the pipes)
          FINAL_URL=$(echo -n "$COMBINED_URLS" | jq -sRr @uri)
          
          REQUEST_URL="http://localhost:25500/sub?target=${{ steps.prepare.outputs.target }}&url=${FINAL_URL}&upload=true&upload_path=${{ steps.prepare.outputs.upload_filename }}"
          
          echo "Sending request to subconverter..."
          echo "Processing ${{ steps.prepare.outputs.url_count }} subscription URLs"
          
          RESPONSE=$(curl -v -o response.txt -w "%{http_code}" "$REQUEST_URL" 2>&1)
          HTTP_CODE=$(tail -1 <<< "$RESPONSE")
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response:"
          cat response.txt
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Request failed with status code $HTTP_CODE"
            echo "=== Subconverter logs ==="
            docker logs subconverter
            echo "=== URLs file content ==="
            cat "$URLS_FILE"
            exit 1
          fi
          
          echo "✓ Successfully uploaded to Gist!"
      
      - name: Cleanup
        if: always()
        run: |
          docker stop subconverter || true
          docker rm subconverter || true
